# Package dependency rules, checked by `just arch`. Patterns are regular
# expressions after arch-go's rewriting, so a single package is anchored
# with $ and `x.**` covers x and everything below it. Every package needs a
# rule, and every rule says why.
version: 1
threshold:
  compliance: 100
  coverage: 100
dependenciesRules:
  # the version reads what the Go toolchain wrote into the binary and
  # nothing else
  - package: '**.internal.version$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os
        - os/exec
        - net
        - syscall
  # the configuration only reads the environment it is given, so every other
  # package can depend on it
  - package: '**.internal.config$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
      standard:
        - os
  # logging builds the logger from the configuration and writes where it is
  # told, so it never opens a file or reads the environment itself
  - package: '**.internal.logging$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.config$'
    shouldNotDependsOn:
      standard:
        - os
  # the integration tests run frogly as a binary and see it only from the
  # outside, the way a person or an agent does
  - package: '**.test.integration$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
  # authentication only checks tokens against the issuer, so it knows
  # nothing about the rest of frogly
  - package: '**.internal.authn$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
  # the API speaks HTTP. It leaves checking tokens to authn and storing to
  # the unit of work, and never knows which database it talks to.
  - package: '**.internal.server$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.authn$'
        - '**.internal.config$'
        - '**.internal.db$'
        - '**.internal.logging$'
        - '**.internal.people$'
        - '**.internal.repositories$'
  # the frontend's Go package only hands out the built files
  - package: '**.frogly.web$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
  # the change tracker is plain data, the repositories of every database
  # use it
  - package: '**.internal.change$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
  # the models and repository interfaces know no database. That keeps the
  # rest of frogly free of database code too.
  - package: '**.internal.repositories$'
    shouldNotDependsOn:
      internal:
        - '**.internal.**'
        - '**.cmd.**'
  # the unit of work's interfaces only speak in models and repositories
  - package: '**.internal.db$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.repositories$'
  # the contract every adapter meets speaks only in the unit of work and
  # the models
  - package: '**.internal.db.dbtest$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.db$'
        - '**.internal.repositories$'
  # a database's repositories write what the tracker recorded, in their own
  # SQL
  - package: '**.internal.repositories.sqlite$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.change$'
        - '**.internal.repositories$'
  # a database wires its driver, migrations and repositories into a unit of
  # work
  - package: '**.internal.db.sqlite$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.change$'
        - '**.internal.db$'
        - '**.internal.repositories$'
        - '**.internal.repositories.sqlite$'
  # like SQLite's, Postgres's repositories write in their own SQL
  - package: '**.internal.repositories.postgres$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.change$'
        - '**.internal.repositories$'
  # like SQLite's, Postgres's database wires its driver, migrations and
  # repositories
  - package: '**.internal.db.postgres$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.change$'
        - '**.internal.db$'
        - '**.internal.repositories$'
        - '**.internal.repositories.postgres$'
  # people works with users through the unit of work, never with a
  # database directly
  - package: '**.internal.people$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.authn$'
        - '**.internal.db$'
        - '**.internal.repositories$'
  # tests of other packages open a SQLite database through it, and only
  # tests use it
  - package: '**.internal.db.sqlite.sqlitetest$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.db$'
        - '**.internal.db.sqlite$'
  # a command only wires packages together, the work happens in internal
  - package: '**.cmd.frogly$'
    shouldOnlyDependsOn:
      internal:
        - '**.internal.authn$'
        - '**.internal.config$'
        - '**.internal.db$'
        - '**.internal.db.postgres$'
        - '**.internal.db.sqlite$'
        - '**.internal.logging$'
        - '**.internal.server$'
        - '**.internal.version$'
        - '**.web$'
