pre-commit:
  parallel: true
  jobs:
    - name: prose check
      run: just prose

commit-msg:
  jobs:
    - name: conventional commit message
      run: |
        head -n1 {1} | grep -qE '^(feat|fix|chore|docs|refactor|test|perf|build|ci|revert)!?: .+' || {
          echo "commit message must be 'type: description', without a scope"
          exit 1
        }
    - name: sign-off
      run: |
        grep -qE '^Signed-off-by: .+ <.+@.+>' {1} || {
          echo "commit must be signed off (git commit -s)"
          exit 1
        }
