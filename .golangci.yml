version: "2"

run:
  # tests that need the services from `just integration` only build with
  # this tag, see test/integration and internal/db/postgres
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - copyloopvar
    - errname
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - intrange
    - misspell
    - nilerr
    - nolintlint
    - revive
    - testifylint
    - unconvert
    - unparam
    - usestdlibvars
    - wsl_v5
  settings:
    exhaustive:
      default-signifies-exhaustive: true
    nolintlint:
      require-explanation: true
    wsl_v5:
      # house style is one rule: an empty line follows every block
      default: none
      enable:
        - after-block

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/the127/frogly
