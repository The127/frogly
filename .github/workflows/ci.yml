name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # lets the codecov upload authenticate through oidc, without a secret
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # the ruleset of main requires this check. It runs the same `just ci` as
  # the git hooks, with the tools in the versions mise.toml names
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # `just ci` starts Keyline and Postgres for the integration tests. The
      # timeout stops a service that never gets ready from holding the job
      # for hours
      - run: just ci
        timeout-minutes: 15
      - name: show the services' logs
        if: failure()
        run: |
          docker logs frogly-keyline || true
          docker logs frogly-postgres || true
      - name: upload coverage to codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: ./coverage.out
          # only coverage.out, no search for other coverage formats
          disable_search: true
