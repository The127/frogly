[tools]
go = "1.27.2"
golangci-lint = "2.14.0"
just = "1.58.0"
lefthook = "2.2.2"
# reuse is a Python tool. mise installs it with uv. Without
# charset-normalizer, reuse can't tell the encoding of a file.
uv = "0.13.0"
"pipx:reuse" = { version = "6.2.0", extras = "charset-normalizer" }
process-compose = "1.122.0"
hurl = "8.0.1"
node = "24.22.0"
pnpm = "12.11.2"

[env]
# process-compose serves its API on 8080 by default, which is frogly's port
PC_PORT_NUM = "8079"
