# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  # CodeRabbit is a required check on main, so every pull request needs its
  # status, Dependabot's too. A review that fails says so instead of staying
  # pending, which would block the merge for good.
  auto_review:
    ignore_usernames: []
  fail_commit_status: true
  pre_merge_checks:
    # golangci-lint already asks for doc comments on exported names, and
    # tests and main don't need one
    docstrings:
      mode: "off"
  # Generated code and lock files aren't reviewed.
  path_filters:
    - "!**/go.sum"
  path_instructions:
    - path: "**/*.md"
      instructions: |
        Check the prose against these rules. Write for a reader who wasn't
        there. Use simple technical English with plain sentence structure.
        No em dashes and no semicolons. Say what an internal name is before
        using it. Avoid chains of "of", bold lead-ins on bullets, and lists
        where a paragraph would do.
