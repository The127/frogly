# Keyline for development and CI, started by process-compose.yml. It sets up
# everything frogly needs to log someone in. Never use it for anything
# reachable from outside your machine: the password and the service users'
# keys are public.
server:
  host: "0.0.0.0"
  port: 8081
  externalUrl: "http://localhost:8082"
  # browsers call Keyline from these origins: Keyline's own login pages,
  # and frogly's frontend from the Go server and the Vite dev server
  allowedOrigins:
    - "http://localhost:5177"
    - "http://localhost:8080"
    - "http://localhost:5173"

frontend:
  externalUrl: "http://localhost:5177"

database:
  mode: "sqlite"
  sqlite:
    database: "/app/data/keyline.db"

initialVirtualServer:
  name: "frogly"
  displayName: "frogly"
  enableRegistration: false
  primarySigningAlgorithm: "EdDSA"
  # the person you log in as. The password is "frogly".
  createAdmin: true
  admin:
    username: "karo"
    displayName: "Karo"
    primaryEmail: "karo@frogly.local"
    passwordHash: "$argon2id$v=19$m=65536,t=3,p=4$c6kr9Bazt2CNZekYzlL7ag$n3F+aAHuOhpqrAfL8shRO+zr+sQgGobaJa+YL8FQCts"
  # the integration tests log in as these users with the private keys in
  # test-service-user.pem and test-service-user-2.pem. Two of them, so a
  # test can check what one person can't see of another's.
  serviceUsers:
    - username: "frogly-tests"
      publicKey:
        kid: "frogly-tests"
        pem: |
          -----BEGIN PUBLIC KEY-----
          MCowBQYDK2VwAyEAs0EvhIJLH2/P2Ez6JFZ+N8C5PqHxWCabcsr+CruUNtI=
          -----END PUBLIC KEY-----
    - username: "frogly-tests-2"
      publicKey:
        kid: "frogly-tests-2"
        pem: |
          -----BEGIN PUBLIC KEY-----
          MCowBQYDK2VwAyEAv0UVcyA/UCi78I36XZpnEPl2+nmVoGv8QnMqT7vyqFc=
          -----END PUBLIC KEY-----
  projects:
    - slug: "frogly"
      name: "frogly"
      description: "frogly, the task planner"
      applications:
        - name: "frogly"
          displayName: "frogly"
          type: "public"
          redirectUris:
            - "http://localhost:8080/callback"
            - "http://localhost:5173/callback"
          postLogoutRedirectUris:
            - "http://localhost:8080/"
            - "http://localhost:5173/"
          # frogly's API reads the name from the access token
          userinfoInAccessToken: true

keyStore:
  mode: "directory"
  directory:
    path: "/app/keys"

cache:
  mode: "memory"

leaderElection:
  mode: "none"
